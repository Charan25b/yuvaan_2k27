services:
  postgres:
    image: postgres:17-alpine
    container_name: yuvaan-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: yuvaan
      POSTGRES_USER: yuvaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - yuvaan_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuvaan -d yuvaan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  yuvaan_postgres_data: